apiVersion: v1
kind: Namespace
metadata:
  name: hawkerflow
---
apiVersion: v1
kind: Secret
metadata:
  name: hawkerflow-db-secret
  namespace: hawkerflow
type: Opaque
stringData:
  postgres.user: "user"
  postgres.password: "root"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hawkerflow-customer-config
  namespace: hawkerflow
data:
  config.yml: |
    service:
      title: HawkerFlow Service Customer
      root_path: '/customer'
      port: 8080
      host: '0.0.0.0'
      allow_origins:
        - '*'
      methods:
        - '*'
      headers:
        - '*'
      docs_url: '/docs'
      redoc_url: '/redoc'
      reload: false
      scheme: 'http'
      credentials: true

    datasource:
      driver:
        package: "drivers.postgres_driver"
        driver_class: "PostgresDriver"
      database:
        connection_url: 'postgresql+psycopg2'
        driver_name: 'postgresql+psycopg2'
        name: 'hawkerflow_stall_db'
        host: 'host.docker.internal'
        port: 5432
      options:
        echo: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-customer
  namespace: hawkerflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-customer
  template:
    metadata:
      labels:
        app: service-customer
    spec:
      containers:
        - name: service-customer
          image: 000000000000.dkr.ecr.us-east-1.localhost.localstack.cloud:4566/hawker-flow-customer:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PROJECT_ROOT
              value: /usr/local/app
            - name: PYTHONUNBUFFERED
              value: "1"
          volumeMounts:
            - name: config-volume
              mountPath: /usr/local/app/resources
            - name: vault-secrets
              mountPath: /usr/local/app/vault
              readOnly: true
      volumes:
        - name: config-volume
          configMap:
            name: hawkerflow-customer-config
        - name: vault-secrets
          secret:
            secretName: hawkerflow-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: service-customer
  namespace: hawkerflow
spec:
  type: NodePort
  selector:
    app: service-customer
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hawkerflow-ingress
  namespace: hawkerflow
  annotations:
    # --- For AWS ALB Ingress Controller (AWS EKS & LocalStack) ---
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /customer/docs
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 8080}]'
spec:
  # Use 'alb' for AWS ALB Controller, or remove/change to 'traefik'/'nginx' if using local k3d ingress
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /customer
            pathType: Prefix
            backend:
              service:
                name: service-customer
                port:
                  number: 8080